[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "pathquill"
version = "0.0.1"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
[tool.setuptools.packages.find]
include = ["pathquill*"]
[project.scripts]
pathquill = "pathquill.daemon:main"
pathquill-status = "pathquill.cli:main"
